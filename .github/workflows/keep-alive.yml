name: Staging Render Keep-Alive

on:
  schedule:
    - cron: "*/13 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-render-keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: staging
    steps:
      - name: Ping Stepper liveness endpoint
        env:
          STEPPER_URL: ${{ secrets.STAGING_STEPPER_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${STEPPER_URL}" || { echo "STAGING_STEPPER_URL is not configured."; exit 1; }
          curl --fail --show-error --silent --max-time 60 --retry 2 --retry-delay 5 "${STEPPER_URL%/}/health" > /dev/null
